name: server-ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'server/**'
      - 'sql/**'
      - '.github/workflows/server-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'sql/**'
      - '.github/workflows/server-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Verify hardened defaults
        run: bash server/scripts/verify-security-defaults.sh

      - name: Verify server
        run: mvn -B -ntp -f server/pom.xml verify

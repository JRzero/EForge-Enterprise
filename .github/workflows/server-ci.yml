name: server-ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'codex/**']
    paths:
      - 'server/**'
      - 'sql/**'
      - 'web/**'
      - 'contracts/openapi/**'
      - '.github/workflows/server-ci.yml'
      - '.github/scripts/install-browser.sh'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths:
      - 'server/**'
      - 'sql/**'
      - 'web/**'
      - 'contracts/openapi/**'
      - '.github/workflows/server-ci.yml'
      - '.github/scripts/install-browser.sh'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  auth-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [default, enabled]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Package server
        run: mvn -B -ntp -f server/pom.xml package -DskipTests
      - name: Install web integration tools
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Install browser
        working-directory: web
        run: bash ../.github/scripts/install-browser.sh
      - name: Verify canonical auth against disposable MySQL and Redis
        shell: pwsh
        run: |
          $ciAuthOptions = @{VerifyWeb = $true; OpenApiOutputPath = 'contracts/openapi/api-v1.json'}
          if ('${{ matrix.profile }}' -eq 'enabled') {
            $ciAuthOptions.EnableConsoles = $true
            $ciAuthOptions.EnableCustomOutput = $true
          }
          ./server/scripts/verify-auth-integration.ps1 @ciAuthOptions
      - name: Verify live OpenAPI snapshot matches the committed contract
        run: git diff --exit-code -- contracts/openapi/api-v1.json
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-integration-logs-${{ matrix.profile }}
          path: |
            server/eforge-boot/target/auth-integration/*.log
            web/test-results/
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Verify hardened defaults
        run: bash server/scripts/verify-security-defaults.sh

      - name: Verify server
        run: mvn -B -ntp -f server/pom.xml verify

      - name: Verify prepared creation SQL fidelity on isolated MySQL
        shell: pwsh
        run: |
          ./server/scripts/verify-generator-creation-policy.ps1 -LowerCaseTableNames 0
          ./server/scripts/verify-generator-creation-policy.ps1 -LowerCaseTableNames 1

      - name: Verify generator preflight and physical phases on actual JDBC databases
        shell: pwsh
        run: |
          ./server/scripts/verify-generator-creation-preflight.ps1 -LowerCaseTableNames 0
          ./server/scripts/verify-generator-creation-preflight.ps1 -LowerCaseTableNames 1

      - name: Verify guarded creation metadata import on actual Spring and MyBatis
        shell: pwsh
        run: |
          ./server/scripts/verify-generator-creation-import.ps1 -LowerCaseTableNames 0
          ./server/scripts/verify-generator-creation-import.ps1 -LowerCaseTableNames 1

      - name: Verify approved task transaction and Quartz admission boundary on actual MySQL
        shell: pwsh
        run: |
          ./server/scripts/verify-task-mutation-boundary.ps1 -LowerCaseTableNames 0
          ./server/scripts/verify-task-mutation-boundary.ps1 -LowerCaseTableNames 1

      - name: Verify immutable generation snapshots on actual Spring and MyBatis
        shell: pwsh
        run: |
          ./server/scripts/verify-generator-rendering-snapshot.ps1 -LowerCaseTableNames 0
          ./server/scripts/verify-generator-rendering-snapshot.ps1 -LowerCaseTableNames 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned generated client verification tools
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Verify generated CRUD tree and sub modules on actual MySQL
        shell: pwsh
        run: |
          ./server/scripts/verify-generator-business-module.ps1 -LowerCaseTableNames 0
          ./server/scripts/verify-generator-business-module.ps1 -LowerCaseTableNames 1
      - name: Verify generated text contexts against actual MySQL modes
        shell: pwsh
        run: |
          ./server/scripts/verify-generator-output-text.ps1 -LowerCaseTableNames 0
          ./server/scripts/verify-generator-output-text.ps1 -LowerCaseTableNames 1
      - name: Install generated-page browser
        working-directory: web
        run: bash ../.github/scripts/install-browser.sh
      - name: Verify generated modules and React pages in original Boot JWT Redis and audit
        shell: pwsh
        run: |
          ./server/scripts/verify-auth-integration.ps1 -VerifyGeneratedReactOnly -OpenApiOutputPath server/eforge-boot/target/generated-react-disabled-openapi.json
          ./server/scripts/verify-auth-integration.ps1 -VerifyGeneratedReactOnly -EnableConsoles -EnableCustomOutput -OpenApiOutputPath server/eforge-boot/target/generated-react-enabled-openapi.json
          if ((Get-FileHash server/eforge-boot/target/generated-react-disabled-openapi.json).Hash -ne (Get-FileHash server/eforge-boot/target/generated-react-enabled-openapi.json).Hash) {throw 'Installed generated contracts differ between profiles.'}
  runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eforge_enterprise
          MYSQL_USER: eforge
          MYSQL_PASSWORD: eforgepass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Package server
        run: mvn -B -ntp -f server/pom.xml package -DskipTests

      - name: Verify MySQL, Redis and login session integration
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eforge_enterprise
          EFORGE_DB_USERNAME: eforge
          EFORGE_DB_PASSWORD: eforgepass
          EFORGE_TOKEN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: bash server/scripts/verify-runtime-integration.sh

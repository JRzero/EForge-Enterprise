name: import-ruoyi-server-baseline

on:
  push:
    branches: ['feat/server-baseline-import']

permissions:
  contents: write

jobs:
  import-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout EForge Enterprise
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch pinned RuoYi backend baseline
        run: |
          rm -rf /tmp/ruoyi
          git init /tmp/ruoyi
          git -C /tmp/ruoyi remote add origin https://github.com/yangzongzhuan/RuoYi-Vue.git
          git -C /tmp/ruoyi fetch --depth 1 origin a51a838b71b446ea27256900efe7ed2faa2a02fd
          git -C /tmp/ruoyi checkout --detach FETCH_HEAD
          test "$(git -C /tmp/ruoyi rev-parse HEAD)" = "a51a838b71b446ea27256900efe7ed2faa2a02fd"

      - name: Import backend-only source
        run: |
          rm -rf server sql/upstream THIRD_PARTY_LICENSES
          mkdir -p server sql/upstream THIRD_PARTY_LICENSES

          cp /tmp/ruoyi/pom.xml server/pom.xml
          cp -R /tmp/ruoyi/ruoyi-admin server/
          cp -R /tmp/ruoyi/ruoyi-framework server/
          cp -R /tmp/ruoyi/ruoyi-system server/
          cp -R /tmp/ruoyi/ruoyi-common server/
          cp -R /tmp/ruoyi/ruoyi-generator server/
          cp -R /tmp/ruoyi/ruoyi-quartz server/
          cp -R /tmp/ruoyi/sql/. sql/upstream/
          cp /tmp/ruoyi/LICENSE THIRD_PARTY_LICENSES/RUOYI_LICENSE

          cat > server/UPSTREAM.md <<'EOF'
          # RuoYi backend import baseline

          - Repository: https://github.com/yangzongzhuan/RuoYi-Vue
          - Version: 3.9.2
          - Branch reference: springboot3
          - Imported commit: a51a838b71b446ea27256900efe7ed2faa2a02fd

          This directory initially preserves upstream backend module names and semantics so a green Maven baseline can be established before controlled renaming/refactoring.

          The Vue frontend is intentionally not imported.
          EOF

      - name: Verify unchanged backend baseline
        run: mvn -B -ntp -f server/pom.xml test

      - name: Commit verified backend baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server sql/upstream THIRD_PARTY_LICENSES
          if git diff --cached --quiet; then
            echo "No backend import changes to commit."
          else
            git commit -m "chore: import pinned RuoYi Spring Boot 3 backend baseline [skip ci]"
            git push
          fi

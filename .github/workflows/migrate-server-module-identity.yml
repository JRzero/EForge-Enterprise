name: migrate-server-module-identity

on:
  push:
    branches: ['feat/server-module-identity']

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rename server modules and Maven coordinates
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          server = Path('server')
          renames = {
              'ruoyi-admin': 'eforge-boot',
              'ruoyi-framework': 'eforge-framework',
              'ruoyi-system': 'eforge-system',
              'ruoyi-common': 'eforge-common',
              'ruoyi-generator': 'eforge-generator',
              'ruoyi-quartz': 'eforge-quartz',
          }

          for old, new in renames.items():
              old_path = server / old
              new_path = server / new
              if old_path.exists() and not new_path.exists():
                  old_path.rename(new_path)

          replacements = {
              '<groupId>com.ruoyi</groupId>': '<groupId>io.eforge.enterprise</groupId>',
              '<artifactId>ruoyi</artifactId>': '<artifactId>eforge-enterprise-server</artifactId>',
              '<artifactId>ruoyi-admin</artifactId>': '<artifactId>eforge-boot</artifactId>',
              '<artifactId>ruoyi-framework</artifactId>': '<artifactId>eforge-framework</artifactId>',
              '<artifactId>ruoyi-system</artifactId>': '<artifactId>eforge-system</artifactId>',
              '<artifactId>ruoyi-common</artifactId>': '<artifactId>eforge-common</artifactId>',
              '<artifactId>ruoyi-generator</artifactId>': '<artifactId>eforge-generator</artifactId>',
              '<artifactId>ruoyi-quartz</artifactId>': '<artifactId>eforge-quartz</artifactId>',
              '<module>ruoyi-admin</module>': '<module>eforge-boot</module>',
              '<module>ruoyi-framework</module>': '<module>eforge-framework</module>',
              '<module>ruoyi-system</module>': '<module>eforge-system</module>',
              '<module>ruoyi-common</module>': '<module>eforge-common</module>',
              '<module>ruoyi-generator</module>': '<module>eforge-generator</module>',
              '<module>ruoyi-quartz</module>': '<module>eforge-quartz</module>',
              '<ruoyi.version>3.9.2</ruoyi.version>': '<eforge.version>0.1.0-SNAPSHOT</eforge.version>',
              '${ruoyi.version}': '${eforge.version}',
          }

          for pom in server.rglob('pom.xml'):
              text = pom.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              text = text.replace('<version>3.9.2</version>', '<version>0.1.0-SNAPSHOT</version>')
              pom.write_text(text, encoding='utf-8')

          root = server / 'pom.xml'
          text = root.read_text(encoding='utf-8')
          text = text.replace('<name>ruoyi</name>', '<name>eforge-enterprise-server</name>')
          text = text.replace('<url>http://www.ruoyi.vip</url>', '<url>https://github.com/JRzero/EForge-Enterprise</url>')
          text = text.replace('<description>若依管理系统</description>', '<description>EForge Enterprise server foundation</description>')
          root.write_text(text, encoding='utf-8')

          upstream = server / 'UPSTREAM.md'
          text = upstream.read_text(encoding='utf-8')
          marker = "The Vue frontend is intentionally not imported.\n"
          note = """The Vue frontend is intentionally not imported.

          ## EForge module identity migration

          After the green upstream baseline was established, Maven/module identities were renamed:

          - ruoyi-admin → eforge-boot
          - ruoyi-framework → eforge-framework
          - ruoyi-system → eforge-system
          - ruoyi-common → eforge-common
          - ruoyi-generator → eforge-generator
          - ruoyi-quartz → eforge-quartz

          Maven groupId is now io.eforge.enterprise and the framework version starts at 0.1.0-SNAPSHOT.

          Java package names intentionally remain com.ruoyi at this stage and will be migrated separately.
          """
          if marker in text and 'EForge module identity migration' not in text:
              text = text.replace(marker, note)
              upstream.write_text(text, encoding='utf-8')
          PY

      - name: Verify migrated Maven/module identity
        run: mvn -B -ntp -f server/pom.xml verify

      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "refactor: rename server modules and Maven coordinates [skip ci]"
            git push
          fi

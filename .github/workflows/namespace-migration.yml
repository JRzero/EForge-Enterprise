name: namespace-migration

on:
  push:
    branches:
      - refactor/java-namespace-v0.4
    paths:
      - server/**
      - .github/workflows/namespace-migration.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eforge_enterprise
          MYSQL_USER: eforge
          MYSQL_PASSWORD: eforgepass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml

      - name: Apply deterministic namespace migration
        run: python3 server/scripts/migrate-java-namespace.py

      - name: Verify hardened defaults
        run: bash server/scripts/verify-security-defaults.sh

      - name: Verify server
        run: mvn -B -ntp -f server/pom.xml verify

      - name: Verify MySQL, Redis and login session integration
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: eforge_enterprise
          EFORGE_DB_USERNAME: eforge
          EFORGE_DB_PASSWORD: eforgepass
          EFORGE_TOKEN_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: bash server/scripts/verify-runtime-integration.sh

      - name: Create verified migration pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "refactor: complete Java namespace migration"
          branch: automation/java-namespace-v0.4-complete
          delete-branch: true
          base: refactor/java-namespace-v0.4
          title: "refactor: complete Java namespace migration"
          body: |
            Completes the Java namespace migration from `com.ruoyi` to `io.eforge.enterprise`.

            Generated only after:
            - zero legacy namespace references under `server/`
            - hardened-default verification
            - Maven verify
            - MySQL + Redis runtime integration
            - admin login, `/getInfo`, and Redis session verification

name: web-ci
on:
  push:
    branches: [main, 'codex/**']
    paths: ['web/**', 'contracts/openapi/**', 'dependencies/eforge/**', 'scripts/measure-web-entry-assets.mjs', 'scripts/tests/measure-web-entry-assets.test.mjs', 'scripts/web-entry-budgets.json', '.github/workflows/web-ci.yml', '.github/scripts/install-browser.sh', '.gitattributes']
  pull_request:
    paths: ['web/**', 'contracts/openapi/**', 'dependencies/eforge/**', 'scripts/measure-web-entry-assets.mjs', 'scripts/tests/measure-web-entry-assets.test.mjs', 'scripts/web-entry-budgets.json', '.github/workflows/web-ci.yml', '.github/scripts/install-browser.sh', '.gitattributes']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check:generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify entry asset budgets
        run: |
          node --test ../scripts/tests/measure-web-entry-assets.test.mjs
          node ../scripts/measure-web-entry-assets.mjs --budget ../scripts/web-entry-budgets.json
      - run: bash ../.github/scripts/install-browser.sh
      - name: Verify release output in a real browser
        run: npm run test:e2e:dist
      - name: Measure retained pages and paged large lists
        run: npx playwright test --config playwright.performance.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-performance
          path: web/test-results/performance/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failures
          path: web/test-results/

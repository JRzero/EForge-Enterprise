name: web-ci
on:
  push:
    branches: [main, 'codex/**']
    paths: ['web/**', 'contracts/openapi/**', 'dependencies/eforge/**', '.github/workflows/web-ci.yml', '.github/scripts/install-browser.sh', '.gitattributes']
  pull_request:
    paths: ['web/**', 'contracts/openapi/**', 'dependencies/eforge/**', '.github/workflows/web-ci.yml', '.github/scripts/install-browser.sh', '.gitattributes']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check:generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: bash ../.github/scripts/install-browser.sh
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-browser-failures
          path: web/test-results/

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: web-production-build-${{ github.sha }}
          path: web/dist/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-ui-hardening-evidence-${{ github.sha }}
          path: web/test-results/ui-hardening-*.png
          if-no-files-found: ignore
          retention-days: 7

# EForge Enterprise application configuration
#
# The configuration prefix remains "ruoyi" temporarily because the imported
# upstream Java configuration classes still use that prefix. It will be renamed
# in a later controlled package/config migration.
ruoyi:
  name: EForge Enterprise
  version: 0.1.0
  copyrightYear: 2026
  profile: ${EFORGE_PROFILE:/tmp/eforge/uploadPath}
  addressEnabled: false
  captchaType: math

server:
  port: ${EFORGE_SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 20

logging:
  level:
    io.eforge.enterprise: ${EFORGE_LOG_LEVEL:info}
    org.springframework: warn

user:
  password:
    maxRetryCount: 5
    lockTime: 10

spring:
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: false
  data:
    redis:
      host: ${EFORGE_REDIS_HOST:localhost}
      port: ${EFORGE_REDIS_PORT:6379}
      database: ${EFORGE_REDIS_DATABASE:0}
      password: ${EFORGE_REDIS_PASSWORD:}
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

token:
  header: Authorization
  # Required at runtime. Do not commit a fallback secret.
  secret: ${EFORGE_TOKEN_SECRET}
  expireTime: ${EFORGE_TOKEN_EXPIRE_MINUTES:30}

mybatis:
  typeAliasesPackage: io.eforge.enterprise.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    enabled: ${EFORGE_OPENAPI_ENABLED:false}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${EFORGE_SWAGGER_UI_ENABLED:false}
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: 'EForge Enterprise API'
      paths-to-match: '/api/v1/**'
      packages-to-scan: io.eforge.enterprise.web.api.v1

eforge:
  cors:
    # Comma-separated exact origins. Wildcards are intentionally unsupported.
    allowed-origins: ${EFORGE_CORS_ALLOWED_ORIGINS:http://localhost:5173}

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*

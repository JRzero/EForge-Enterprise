spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        url: ${EFORGE_DB_URL:jdbc:mysql://localhost:3306/eforge_enterprise?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8}
        username: ${EFORGE_DB_USERNAME:eforge}
        # Required at runtime. Do not commit a database password.
        password: ${EFORGE_DB_PASSWORD}
      slave:
        enabled: ${EFORGE_DB_SLAVE_ENABLED:false}
        url: ${EFORGE_DB_SLAVE_URL:}
        username: ${EFORGE_DB_SLAVE_USERNAME:}
        password: ${EFORGE_DB_SLAVE_PASSWORD:}
      initialSize: 5
      minIdle: 5
      maxActive: 20
      maxWait: 60000
      connectTimeout: 30000
      socketTimeout: 60000
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      webStatFilter:
        enabled: ${EFORGE_DRUID_WEB_STAT_ENABLED:false}
      statViewServlet:
        # Disabled by default. Enabling it still requires application authentication.
        enabled: ${EFORGE_DRUID_CONSOLE_ENABLED:false}
        allow: ${EFORGE_DRUID_ALLOW:127.0.0.1}
        url-pattern: /druid/*
        login-username: ${EFORGE_DRUID_USERNAME:}
        login-password: ${EFORGE_DRUID_PASSWORD:}
      filter:
        stat:
          enabled: ${EFORGE_DRUID_SQL_STAT_ENABLED:false}
          log-slow-sql: true
          slow-sql-millis: 1000
          merge-sql: true
        wall:
          config:
            multi-statement-allow: false
